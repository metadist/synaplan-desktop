name: CI

# Pull requests are the only way onto main (repository rulesets: BaseRules).
# "All Checks Passed" is the required status check — do not rename that job.
# A release tag is refused unless this workflow succeeded for that commit.
#
# Superseded pull-request runs are cancelled. A push to main (the merge) gets
# its own group and is never cancelled, so a release can rely on that result.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Full Tauri build prerequisites for Ubuntu (glibc baseline). Kept in one place.
  LINUX_BUILD_DEPS: >-
    libwebkit2gtk-4.1-dev
    libayatana-appindicator3-dev
    librsvg2-dev
    patchelf
    libxdo-dev
    libssl-dev
    libdbus-1-dev
    pkg-config
    build-essential
    curl
    wget
    file

jobs:
  # ---- Lint + type-check (Linux only) -------------------------------------
  lint:
    name: Lint + types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust (fmt only)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - name: ESLint + Prettier
        run: npm run lint
      - name: Type check (vue-tsc)
        run: npm run type-check
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

  # ---- No shell is ever constructed (C12) --------------------------------
  no-shell-guard:
    name: No-shell guard (C12)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Grep for forbidden shell invocations
        run: bash scripts/no-shell-guard.sh

  # ---- Unit tests (Rust core + TS) on all three OSes ---------------------
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux deps for synaplan-core
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libssl-dev
      - run: npm ci
      - name: TS unit tests (vitest)
        run: npm run test
      - name: Rust core clippy
        working-directory: src-tauri
        run: cargo clippy -p synaplan-core --all-targets -- -D warnings
      - name: Rust core tests
        working-directory: src-tauri
        run: cargo test -p synaplan-core

  # ---- Debug build of the full app on all three OSes ---------------------
  build:
    name: Debug build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ env.LINUX_BUILD_DEPS }}
      - run: npm ci
      - name: Build frontend (produces dist/ for generate_context!)
        run: npm run build
      - name: Clippy (whole workspace)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Debug build (cargo)
        working-directory: src-tauri
        run: cargo build

  # ---- Aggregate gate ----------------------------------------------------
  # This job name is the ruleset's required status check. A skipped gate
  # would let a red pull request merge, so it always runs and fails closed.
  all-checks:
    name: All Checks Passed
    if: always()
    needs: [lint, no-shell-guard, unit, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded
        env:
          LINT: ${{ needs.lint.result }}
          GUARD: ${{ needs.no-shell-guard.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          require() { [ "$2" = success ] || fail "$1 was $2, expected success"; }
          require "Lint + types" "$LINT"
          require "No-shell guard (C12)" "$GUARD"
          require "Unit tests" "$UNIT"
          require "Debug build" "$BUILD"
          echo "All required checks passed."
