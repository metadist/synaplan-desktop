name: Release

# Builds installers for all three OSes and attaches them to a GitHub release.
# Trigger by pushing a tag like `v0.1.0`, or run manually (workflow_dispatch).
#
# Signing status (Sprint B6 / DC28):
# - macOS: notarized + signed automatically ONCE the APPLE_* secrets exist
#   (Developer ID). Until then the .dmg is unsigned (dev/internal use only).
# - Windows: Authenticode via Azure Trusted Signing is wired as a follow-up
#   (DC28) once the Trusted Signing identity validation is approved; until then
#   the installer is unsigned. Unsigned builds are internal-only — no public
#   download link until signing lands (plan §9).

# A tag or a manual run builds installers only for a commit that is already
# on main and whose CI workflow concluded success. Tagging a red commit does
# not publish a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  LINUX_BUILD_DEPS: >-
    libwebkit2gtk-4.1-dev
    libayatana-appindicator3-dev
    librsvg2-dev
    patchelf
    libxdo-dev
    libssl-dev
    libdbus-1-dev
    pkg-config
    build-essential
    curl
    wget
    file

jobs:
  require-green-ci:
    name: Require green CI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Confirm this commit is on main and CI passed
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${SHA}" --jq .status)"
          case "$status" in
            identical|behind) ;;
            *)
              echo "::error::Refusing to release ${SHA}: it is not on main (compare status: ${status}). Tag a commit that is already on main."
              exit 1
              ;;
          esac

          # Only the latest CI run triggered by a push to main counts. A green
          # pull-request run for the same commit must not release while that
          # push is still going, or after it has failed.
          # The debug build is allowed 45 minutes. Wait only while that push
          # run is still in progress. A red run fails immediately. A missing
          # run on an older commit fails immediately; the tip of main may
          # still be waiting for its push run to appear.
          deadline=$((SECONDS + 3000))
          while true; do
            json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100")"
            latest="$(printf '%s' "$json" | jq -c --arg sha "$SHA" '
              [.workflow_runs[]
                | select(.name == "CI" and .head_sha == $sha and .event == "push" and .head_branch == "main")]
              | sort_by(.id)
              | last // empty
            ')"
            if [ -z "$latest" ]; then
              if [ "$status" = "identical" ] && [ "$SECONDS" -lt "$deadline" ]; then
                echo "No CI push to main for ${SHA} yet; waiting."
                sleep 30
                continue
              fi
              echo "::error::Refusing to release ${SHA}: no CI run for a push to main. All Checks Passed must be green on that push before a release."
              exit 1
            fi
            run_id="$(printf '%s' "$latest" | jq -r .id)"
            run_status="$(printf '%s' "$latest" | jq -r .status)"
            conclusion="$(printf '%s' "$latest" | jq -r .conclusion)"
            case "$run_status" in
              in_progress|queued|pending|waiting|requested)
                if [ "$SECONDS" -ge "$deadline" ]; then
                  echo "::error::CI run ${run_id} for ${SHA} was still ${run_status} after 50 minutes. Tag again after All Checks Passed is green."
                  exit 1
                fi
                echo "CI run ${run_id} for ${SHA} is ${run_status}; waiting."
                sleep 30
                ;;
              completed)
                if [ "$conclusion" = "success" ]; then
                  echo "CI run ${run_id} succeeded for ${SHA}."
                  exit 0
                fi
                echo "::error::Refusing to release ${SHA}: latest CI push to main (${run_id}) concluded ${conclusion}."
                exit 1
                ;;
              *)
                echo "::error::Refusing to release ${SHA}: latest CI push to main (${run_id}) is ${run_status}/${conclusion}."
                exit 1
                ;;
            esac
          done

  release:
    name: Build installers (${{ matrix.os }})
    needs: require-green-ci
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_targets: ''
            args: ''
          - os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - os: windows-latest
            rust_targets: ''
            args: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ env.LINUX_BUILD_DEPS }}
      - run: npm ci
      # macOS Developer ID signing + notarization is added at DC28, once the
      # APPLE_* secrets exist. Passing empty APPLE_* env vars makes tauri attempt
      # (and fail) codesign, so we build UNSIGNED until the certs land. When
      # ready, re-add the APPLE_* env block here (see docs/PLATFORMS.md /
      # .signing/README.md).
      - name: Build + release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          releaseName: 'Synaplan Desktop ${{ github.ref_name }}'
          releaseBody: 'Automated build. Unsigned artifacts are for internal testing until code-signing lands (see docs/PLATFORMS.md).'
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
