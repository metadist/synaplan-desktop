[package]
name = "synaplan-desktop"
version = "1.0.0"
description = "Synaplan Desktop — pair a computer with Synaplan and run skills locally."
authors = ["Synaplan"]
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
publish = false

[lib]
# The library the mobile/desktop entry points call into. `cdylib` is required by
# Tauri; `rlib` lets integration tests and the binary link it.
name = "synaplan_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gethostname = "0.5"
open = "5"
synaplan-core = { path = "synaplan-core" }
tokio = { version = "1", features = ["time"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"

# Already in Tauri's own tree on Linux; named here so `microphone.rs` can grant
# the webview's audio-only permission request (WebKitGTK denies it by default).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }

[workspace]
members = ["synaplan-core"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
