[package]
name = "synaplan-desktop"
version = "0.1.0"
description = "Synaplan Desktop — pair a computer with Synaplan and run skills locally."
authors = ["Synaplan"]
edition = "2021"
rust-version = "1.77"
license = "UNLICENSED"
publish = false

[lib]
# The library the mobile/desktop entry points call into. `cdylib` is required by
# Tauri; `rlib` lets integration tests and the binary link it.
name = "synaplan_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gethostname = "0.5"
synaplan-core = { path = "synaplan-core" }

[workspace]
members = ["synaplan-core"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
