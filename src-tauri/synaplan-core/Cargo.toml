[package]
name = "synaplan-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Platform-independent, unit-tested core for Synaplan Desktop (paths, secret store, pairing, SSE)."
license = "UNLICENSED"
publish = false

[lib]
name = "synaplan_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
url = "2"
globset = "0.4"
unicode-normalization = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }

# The OS secret store. One crate, three native backends, selected per target so
# a reviewer sees the platform split in exactly one place (see AGENTS.md).
# Linux uses the pure-Rust Secret Service backend (zbus) so CI needs no system
# D-Bus libraries; at runtime it talks to GNOME Keyring / KWallet.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
